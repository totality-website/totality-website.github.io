# On every push to main: build with zola and force-push the output to gh-pages
# (what shalzz/zola-deploy-action did). The action's v0.23.1 ships zola 0.23.0,
# which reads the `{#id}` heading anchors in content as Tera comments; 0.23.4+
# builds them, so the official image is pinned instead.
on: push
name: Build and deploy GH Pages
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: build
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/site" -w /site ghcr.io/getzola/zola:v0.23.5 build
      - name: deploy
        working-directory: public
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh_action
          git config user.name "GitHub Actions"
          git config user.email "github-actions-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Deploy ${GITHUB_REPOSITORY} to ${GITHUB_REPOSITORY}:gh-pages"
          git push --force "https://${GITHUB_ACTOR}:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh_action:gh-pages
